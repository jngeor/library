spring.application.name=api-libros
server.port=8080

# Base de datos H2 en memoria (se reinicia cada vez que se ejecuta la app)
spring.datasource.url=jdbc:h2:mem:biblioteca
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea la tabla "libros" a partir de la clase Libro
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Carga los datos de data.sql después de crear la tabla
spring.jpa.defer-datasource-initialization=true

# Consola web para ver la tabla: http://localhost:8080/h2-console
spring.h2.console.enabled=true
